<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XBTI 管理后台 · 答题记录</title>
  <script src="assets/js/data.js"></script>
  <style>
    :root {
      --bg: #f4efe4;
      --card: #fffdf8;
      --ink: #2b2620;
      --muted: #6b6354;
      --line: #e3ddd0;
      --primary: #d9480f;
      --primary-2: #e6773e;
      --success: #2f9e44;
      --shadow: 0 8px 24px rgba(43, 38, 32, .08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }

    /* Header */
    header {
      background: linear-gradient(135deg, #2b2620 0%, #3e352b 100%);
      color: #fff;
      padding: 18px 22px;
      display: flex; align-items: center; gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 4px 20px rgba(43,38,32,.18);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand b { font-size: 20px; letter-spacing: 1px; }
    .brand span { font-size: 12px; opacity: .65; border-left: 1px solid rgba(255,255,255,.3); padding-left: 12px; }
    .token-bar { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .token-bar input {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px;
      color: #fff;
      padding: 9px 13px;
      min-width: 240px;
      outline: none;
      font-size: 13px;
    }
    .token-bar input::placeholder { color: rgba(255,255,255,.45); }
    .btn {
      border: none; border-radius: 10px; padding: 9px 16px;
      font-size: 13px; cursor: pointer; transition: transform .08s, opacity .15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-2); }
    .btn-ghost { background: rgba(255,255,255,.14); color: #fff; }
    .btn-ghost:hover { background: rgba(255,255,255,.22); }

    /* Layout */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 18px 60px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 6px;
    }
    .stat-card .label { font-size: 12px; color: var(--muted); }
    .stat-card .value { font-size: 28px; font-weight: 700; color: var(--primary); line-height: 1; }
    .stat-card .sub { font-size: 12px; color: var(--muted); }

    /* Toolbar */
    .toolbar {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 18px; box-shadow: var(--shadow);
      display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    }
    .toolbar label { font-size: 13px; color: var(--muted); }
    .toolbar select {
      padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); font-size: 13px;
    }
    .toolbar .spacer { flex: 1; }
    .toolbar .msg { font-size: 13px; color: var(--muted); }

    /* Table card */
    .table-card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: #f0e9da; }
    th { text-align: left; padding: 13px 14px; font-weight: 600; color: var(--ink); font-size: 12px; letter-spacing: .5px; }
    td { padding: 14px; border-top: 1px solid var(--line); vertical-align: top; }
    tbody tr:hover { background: rgba(217,72,15,.04); }

    .time { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff; padding: 5px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .badge code { opacity: .85; font-weight: 400; }
    .match { font-weight: 700; color: var(--primary); font-size: 15px; }

    .radar-cell {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      min-width: 150px;
    }
    .radar-cell svg {
      width: 140px; height: 140px; cursor: pointer;
      transition: transform .15s;
    }
    .radar-cell svg:hover { transform: scale(1.08); }
    .radar-dl {
      font-size: 11px; color: var(--primary); background: none; border: none;
      cursor: pointer; text-decoration: underline;
    }
    .radar-dl:hover { opacity: .7; }

    .answers {
      max-width: 260px;
      background: #f8f5ee; border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 10px; font-size: 12px; color: var(--muted);
      max-height: 90px; overflow: auto; line-height: 1.6;
    }

    .empty {
      text-align: center; padding: 60px 20px; color: var(--muted);
    }
    .empty b { display: block; font-size: 18px; color: var(--ink); margin-bottom: 8px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 30px;
      font-size: 13px; opacity: 0; transition: .25s; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 760px) {
      header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .token-bar { width: 100%; margin-left: 0; }
      .token-bar input { flex: 1; min-width: 0; }
      th, td { padding: 10px; }
      .radar-cell svg { width: 110px; height: 110px; }
      .answers { max-width: 160px; max-height: 70px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <b>XBTI</b>
      <span>管理后台 · 答题记录</span>
    </div>
    <div class="token-bar">
      <input id="token" type="password" placeholder="输入管理员令牌" />
      <button class="btn btn-primary" id="load">拉取记录</button>
      <button class="btn btn-ghost" id="export">导出 CSV</button>
    </div>
  </header>

  <div class="wrap">
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <label>人格筛选：</label>
      <select id="f-type"><option value="">全部</option></select>
      <div class="spacer"></div>
      <div class="msg" id="msg">请输入令牌后拉取数据</div>
    </div>

    <div class="table-card" id="table"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = "/api/admin";
    const $ = s => document.querySelector(s);
    const D = window.XBTI_DATA || {};
    const DIMS = (D.dimensions || []).reduce((m, d) => { m[d.key] = d.label; return m; }, {});

    function toast(msg) {
      const t = $("#toast");
      t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }

    function formatTime(ts) {
      const d = ts ? new Date(ts) : new Date();
      return d.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function renderStats(records) {
      const types = {};
      records.forEach(r => { const k = r.result_name || r.result_type || "?"; types[k] = (types[k] || 0) + 1; });
      const top = Object.entries(types).sort((a, b) => b[1] - a[1])[0] || ["-", 0];
      const html = `
        <div class="stat-card"><div class="label">总记录</div><div class="value">${records.length}</div></div>
        <div class="stat-card"><div class="label">最多人格</div><div class="value">${top[1]}</div><div class="sub">${top[0]}</div></div>
        <div class="stat-card"><div class="label">人格种类</div><div class="value">${Object.keys(types).length}</div><div class="sub">种</div></div>
      `;
      $("#stats").innerHTML = html;
    }

    function parseJson(v) {
      if (v == null) return v;
      if (typeof v !== "string") return v;
      try { return JSON.parse(v); } catch { return v; }
    }
    function normalize(r) {
      return {
        ...r,
        scores: parseJson(r.scores) || {},
        answers: parseJson(r.answers) || [],
        info: parseJson(r.info) || null
      };
    }

    function render(raw) {
      const records = raw.map(normalize);
      window.__records = records;
      renderStats(records);

      const types = new Set();
      records.forEach(r => types.add(r.result_name || r.result_type || "?"));
      const sel = $("#f-type");
      sel.innerHTML = '<option value="">全部</option>';
      types.forEach(t => { const o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o); });
      sel.onchange = () => draw(sel.value ? records.filter(r => (r.result_name || r.result_type) === sel.value) : records);

      draw(records);
    }

    /* 复用 app.js 同款雷达图生成逻辑 */
    function radarSVG(scores) {
      if (!scores || !D.dimensions || !D.dimensions.length) return "";
      const cx = 160, cy = 158, R = 108, dims = D.dimensions;
      const ang = i => (-90 + i * 60) * Math.PI / 180;
      const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
      let grid = "";
      [0.25, 0.5, 0.75, 1].forEach(f => {
        const p = dims.map((_, i) => pt(i, R * f).map(n => n.toFixed(1)).join(",")).join(" ");
        grid += `<polygon points="${p}" fill="none" stroke="#e3ddd0" stroke-width="1"/>`;
      });
      let axes = "", labels = "";
      dims.forEach((d, i) => {
        const [x, y] = pt(i, R);
        axes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e3ddd0" stroke-width="1"/>`;
        const [lx, ly] = pt(i, R + 22);
        const anchor = Math.abs(lx - cx) < 6 ? "middle" : (lx > cx ? "start" : "end");
        labels += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="#5b5345" font-family="sans-serif">${d.label}</text>`;
        const val = scores[d.key];
        const [vx, vy] = pt(i, R * (val / 100));
        labels += `<text x="${vx.toFixed(1)}" y="${(vy - 4).toFixed(1)}" text-anchor="middle" font-size="9" fill="#d9480f" font-family="sans-serif">${val}</text>`;
      });
      const poly = dims.map((d, i) => pt(i, R * (scores[d.key] / 100)).map(n => n.toFixed(1)).join(",")).join(" ");
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
        <rect x="0" y="0" width="320" height="320" rx="14" fill="#fffdf8"/>
        ${grid}${axes}
        <polygon points="${poly}" fill="rgba(217,72,15,0.28)" stroke="#d9480f" stroke-width="2" stroke-linejoin="round"/>
        ${labels}
      </svg>`;
    }
    function radarCell(scores, name) {
      if (!scores) return "-";
      const svg = radarSVG(scores);
      return `<div class="radar-cell">
        <div title="点击放大查看">${svg}</div>
        <button class="radar-dl" data-name="${name}" data-scores='${JSON.stringify(scores)}'>下载雷达图</button>
      </div>`;
    }

    function answersBlock(r) {
      const ans = Array.isArray(r.answers) ? r.answers : [];
      if (!ans.length) return "-";
      const text = ans.map((a, i) => `Q${i + 1}:${a}`).join(" ");
      return `<div class="answers" title="${text}">${text}</div>`;
    }

    function codeCell(info) {
      if (!info) return "-";
      const code = info.code || "匿名考生";
      return `<b style="white-space:nowrap;">${code}</b>`;
    }
    function locCell(info) {
      if (!info) return "-";
      return info.loc || "-";
    }

    function draw(rows) {
      if (!rows.length) {
        $("#table").innerHTML = '<div class="empty"><b>暂无记录</b>先去答几题，再回来就能看到数据了</div>';
        return;
      }
      const head = `<thead><tr><th style="width:110px">时间</th><th>人格</th><th style="width:70px">匹配度</th><th>考生代号</th><th>当前坐标</th><th>六维</th><th>答题答案</th></tr></thead>`;
      const body = rows.map(r => `
        <tr>
          <td>
            <div>${formatTime(r.created_at)}</div>
            <div class="time">${r.record_id || "-"}</div>
          </td>
          <td>
            <span class="badge">${r.result_name || "-"} <code>${r.result_type || ""}</code></span>
          </td>
          <td><span class="match">${r.match_rate != null ? r.match_rate + "%" : "-"}</span></td>
          <td>${codeCell(r.info)}</td>
          <td>${locCell(r.info)}</td>
          <td>${radarCell(r.scores, r.result_name || "雷达图")}</td>
          <td>${answersBlock(r)}</td>
        </tr>
      `).join("");
      $("#table").innerHTML = `<table>${head}<tbody>${body}</tbody></table>`;
      /* 雷达图下载事件委托 */
      $("#table").addEventListener("click", function(e) {
        const btn = e.target.closest(".radar-dl");
        if (!btn) return;
        const name = btn.getAttribute("data-name") || "xbti";
        const sc = JSON.parse(btn.getAttribute("data-scores"));
        const svg = btn.parentElement.querySelector("svg");
        if (!svg) return;
        const xml = new XMLSerializer().serializeToString(svg);
        const img = new Image();
        img.onload = () => {
          const c = document.createElement("canvas"); c.width = 640; c.height = 640;
          const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, 640, 640);
          c.toBlob(b => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(b); a.download = name + "-雷达图.png"; a.click();
            toast("已下载：" + name + "-雷达图.png");
          });
        };
        img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(xml)));
      });
    }

    async function load() {
      const token = $("#token").value.trim();
      if (!token) { toast("请先输入管理员令牌"); return; }
      $("#msg").textContent = "加载中…";
      try {
        const res = await fetch(API + "?token=" + encodeURIComponent(token));
        if (res.status === 403) { $("#msg").textContent = "令牌错误或无权限"; return; }
        const data = await res.json();
        const records = Array.isArray(data) ? data : (data.results || []);
        render(records);
        $("#msg").textContent = `共 ${records.length} 条记录`;
      } catch (e) {
        $("#msg").textContent = "请求失败：" + e.message;
      }
    }

    function exportCSV() {
      const rows = window.__records || [];
      if (!rows.length) { toast("没有可导出的数据"); return; }
      const header = ["record_id", "created_at", "result_type", "result_name", "match_rate", "code_name", "location", "scores", "answers"];
      const lines = [header.join(",")];
      rows.forEach(r => {
        const sc = r.scores ? JSON.stringify(r.scores).replace(/"/g, '""') : "";
        const an = Array.isArray(r.answers) ? r.answers.join("") : "";
        const codeName = r.info ? (r.info.code || "") : "";
        const location = r.info ? (r.info.loc || "") : "";
        lines.push([r.record_id, r.created_at, r.result_type, r.result_name, r.match_rate, '"' + codeName + '"', '"' + location + '"', '"' + sc + '"', '"' + an + '"'].join(","));
      });
      const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "xbti-records.csv"; a.click();
      toast("CSV 已导出");
    }

    $("#load").onclick = load;
    $("#export").onclick = exportCSV;
  </script>
</body>
</html>
