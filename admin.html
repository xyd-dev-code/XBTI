<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XBTI 管理后台 · 答题记录</title>
  <script src="assets/js/data.js"></script>
  <style>
    :root {
      --bg: #f4efe4;
      --card: #fffdf8;
      --ink: #2b2620;
      --muted: #6b6354;
      --line: #e3ddd0;
      --primary: #d9480f;
      --primary-2: #e6773e;
      --success: #2f9e44;
      --shadow: 0 8px 24px rgba(43, 38, 32, .08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }

    /* Header */
    header {
      background: linear-gradient(135deg, #2b2620 0%, #3e352b 100%);
      color: #fff;
      padding: 18px 22px;
      display: flex; align-items: center; gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 4px 20px rgba(43,38,32,.18);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand b { font-size: 20px; letter-spacing: 1px; }
    .brand span { font-size: 12px; opacity: .65; border-left: 1px solid rgba(255,255,255,.3); padding-left: 12px; }
    .token-bar { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .token-bar input {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px;
      color: #fff;
      padding: 9px 13px;
      min-width: 240px;
      outline: none;
      font-size: 13px;
    }
    .token-bar input::placeholder { color: rgba(255,255,255,.45); }
    .btn {
      border: none; border-radius: 10px; padding: 9px 16px;
      font-size: 13px; cursor: pointer; transition: transform .08s, opacity .15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-2); }
    .btn-ghost { background: rgba(255,255,255,.14); color: #fff; }
    .btn-ghost:hover { background: rgba(255,255,255,.22); }

    /* Layout */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 18px 60px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 6px;
    }
    .stat-card .label { font-size: 12px; color: var(--muted); }
    .stat-card .value { font-size: 28px; font-weight: 700; color: var(--primary); line-height: 1; }
    .stat-card .sub { font-size: 12px; color: var(--muted); }

    /* Toolbar */
    .toolbar {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 18px; box-shadow: var(--shadow);
      display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    }
    .toolbar label { font-size: 13px; color: var(--muted); }
    .toolbar select {
      padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); font-size: 13px;
    }
    .toolbar .spacer { flex: 1; }
    .toolbar .msg { font-size: 13px; color: var(--muted); }

    /* Table card */
    .table-card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: #f0e9da; }
    th { text-align: left; padding: 13px 14px; font-weight: 600; color: var(--ink); font-size: 12px; letter-spacing: .5px; }
    td { padding: 14px; border-top: 1px solid var(--line); vertical-align: middle; text-align: center; }
    tbody tr:hover { background: rgba(217,72,15,.04); }

    .time { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff; padding: 5px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .badge code { opacity: .85; font-weight: 400; }
    .match { font-weight: 700; color: var(--primary); font-size: 15px; }

    .radar-cell {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      min-width: 150px;
    }
    .radar-cell svg {
      width: 140px; height: 140px; cursor: pointer;
      transition: transform .15s;
    }
    .radar-cell svg:hover { transform: scale(1.08); }
    .radar-dl {
      font-size: 11px; color: var(--primary); background: none; border: none;
      cursor: pointer; text-decoration: underline;
    }
    .radar-dl:hover { opacity: .7; }

    .answers {
      max-width: 260px;
      background: #f8f5ee; border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 10px; font-size: 12px; color: var(--muted);
      max-height: 90px; overflow: auto; line-height: 1.6;
    }

    /* 答题详情触发按钮 */
    .ans-trigger {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff; border: none; border-radius: 20px;
      padding: 6px 14px; font-size: 12px; cursor: pointer;
      transition: opacity .15s, transform .08s; white-space: nowrap;
    }
    .ans-trigger:hover { opacity: .85; }
    .ans-trigger:active { transform: scale(.96); }

    /* 答题弹窗 */
    .ans-modal-overlay {
      position: fixed; inset: 0; background: rgba(43,38,32,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; animation: ans-fade-in .2s ease;
    }
    @keyframes ans-fade-in { from { opacity: 0; } to { opacity: 1; } }
    .ans-modal {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: 0 20px 60px rgba(43,38,32,.2);
      width: 90%; max-width: 680px; max-height: 82vh;
      display: flex; flex-direction: column;
      animation: ans-slide-up .25s ease;
    }
    @keyframes ans-slide-up { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .ans-modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--line);
      font-weight: 700; font-size: 15px;
    }
    .ans-modal-close {
      background: none; border: none; font-size: 20px; cursor: pointer;
      color: var(--muted); padding: 4px 8px; border-radius: 8px;
      transition: background .15s;
    }
    .ans-modal-close:hover { background: rgba(0,0,0,.06); }
    .ans-modal-body {
      padding: 12px 16px 20px; overflow-y: auto; flex: 1;
    }
    .ans-item {
      border: 1px solid var(--line); border-radius: 12px;
      margin-bottom: 10px; overflow: hidden;
      transition: box-shadow .15s;
    }
    .ans-item:hover { box-shadow: 0 2px 10px rgba(43,38,32,.08); }
    .ans-item.expanded { box-shadow: 0 4px 16px rgba(217,72,15,.1); }
    .ans-item-head {
      padding: 12px 14px; cursor: pointer; font-size: 13px;
      display: flex; align-items: flex-start; gap: 8px;
      user-select: none; transition: background .12s;
    }
    .ans-item-head:hover { background: rgba(217,72,15,.03); }
    .ans-item-head b { color: var(--primary); flex: none; min-width: 32px; }
    .ans-item-body {
      display: none; padding: 0 14px 12px 42px;
    }
    .ans-item.expanded .ans-item-body { display: block; }
    .ans-opts { display: flex; flex-direction: column; gap: 6px; }
    .ans-opt {
      display: inline-block; padding: 5px 10px; border-radius: 8px;
      font-size: 12.5px; background: #f8f5ee; color: var(--muted);
      border: 1px solid transparent; transition: border-color .12s;
    }
    .ans-opt.picked {
      background: rgba(217,72,15,.08); color: var(--primary);
      border-color: rgba(217,72,15,.25); font-weight: 600;
    }

    .empty {
      text-align: center; padding: 60px 20px; color: var(--muted);
    }
    .empty b { display: block; font-size: 18px; color: var(--ink); margin-bottom: 8px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 30px;
      font-size: 13px; opacity: 0; transition: .25s; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 760px) {
      header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .token-bar { width: 100%; margin-left: 0; }
      .token-bar input { flex: 1; min-width: 0; }
      th, td { padding: 10px; }
      .radar-cell svg { width: 110px; height: 110px; }
      .ans-modal { width: 95%; max-height: 88vh; }
      .ans-item-head { font-size: 12.5px; padding: 10px 12px; }
      .ans-item-body { padding: 0 12px 10px 36px; }
      .ans-opt { font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <b>XBTI</b>
      <span>管理后台 · 答题记录</span>
    </div>
    <div class="token-bar">
      <input id="token" type="password" placeholder="输入管理员令牌" />
      <button class="btn btn-primary" id="load">拉取记录</button>
      <button class="btn btn-ghost" id="export">导出 CSV</button>
    </div>
  </header>

  <div class="wrap">
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <label>人格筛选：</label>
      <select id="f-type"><option value="">全部</option></select>
      <div class="spacer"></div>
      <div class="msg" id="msg">请输入令牌后拉取数据</div>
    </div>

    <div class="table-card" id="table"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = "/api/admin";
    const $ = s => document.querySelector(s);
    const D = window.XBTI_DATA || {};
    const DIMS = (D.dimensions || []).reduce((m, d) => { m[d.key] = d.label; return m; }, {});

    function toast(msg) {
      const t = $("#toast");
      t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }

    function formatTime(ts) {
      const d = ts ? new Date(ts) : new Date();
      return d.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function renderStats(records) {
      const types = {};
      records.forEach(r => { const k = r.result_name || r.result_type || "?"; types[k] = (types[k] || 0) + 1; });
      const top = Object.entries(types).sort((a, b) => b[1] - a[1])[0] || ["-", 0];
      const html = `
        <div class="stat-card"><div class="label">总记录</div><div class="value">${records.length}</div></div>
        <div class="stat-card"><div class="label">最多人格</div><div class="value">${top[1]}</div><div class="sub">${top[0]}</div></div>
        <div class="stat-card"><div class="label">人格种类</div><div class="value">${Object.keys(types).length}</div><div class="sub">种</div></div>
      `;
      $("#stats").innerHTML = html;
    }

    function parseJson(v) {
      if (v == null) return v;
      if (typeof v !== "string") return v;
      try { return JSON.parse(v); } catch { return v; }
    }
    function normalize(r) {
      return {
        ...r,
        scores: parseJson(r.scores) || {},
        answers: parseJson(r.answers) || [],
        info: parseJson(r.info) || null
      };
    }

    function render(raw) {
      const records = raw.map(normalize);
      window.__records = records;
      renderStats(records);

      const types = new Set();
      records.forEach(r => types.add(r.result_name || r.result_type || "?"));
      const sel = $("#f-type");
      sel.innerHTML = '<option value="">全部</option>';
      types.forEach(t => { const o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o); });
      sel.onchange = () => draw(sel.value ? records.filter(r => (r.result_name || r.result_type) === sel.value) : records);

      draw(records);
    }

    /* 复用 app.js 同款雷达图生成逻辑 */
    function radarSVG(scores) {
      if (!scores || !D.dimensions || !D.dimensions.length) return "";
      const cx = 160, cy = 158, R = 108, dims = D.dimensions;
      const ang = i => (-90 + i * 60) * Math.PI / 180;
      const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
      let grid = "";
      [0.25, 0.5, 0.75, 1].forEach(f => {
        const p = dims.map((_, i) => pt(i, R * f).map(n => n.toFixed(1)).join(",")).join(" ");
        grid += `<polygon points="${p}" fill="none" stroke="#e3ddd0" stroke-width="1"/>`;
      });
      let axes = "", labels = "";
      dims.forEach((d, i) => {
        const [x, y] = pt(i, R);
        axes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e3ddd0" stroke-width="1"/>`;
        const [lx, ly] = pt(i, R + 22);
        const anchor = Math.abs(lx - cx) < 6 ? "middle" : (lx > cx ? "start" : "end");
        labels += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="#5b5345" font-family="sans-serif">${d.label}</text>`;
        const val = scores[d.key];
        const [vx, vy] = pt(i, R * (val / 100));
        labels += `<text x="${vx.toFixed(1)}" y="${(vy - 4).toFixed(1)}" text-anchor="middle" font-size="9" fill="#d9480f" font-family="sans-serif">${val}</text>`;
      });
      const poly = dims.map((d, i) => pt(i, R * (scores[d.key] / 100)).map(n => n.toFixed(1)).join(",")).join(" ");
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
        <rect x="0" y="0" width="320" height="320" rx="14" fill="#fffdf8"/>
        ${grid}${axes}
        <polygon points="${poly}" fill="rgba(217,72,15,0.28)" stroke="#d9480f" stroke-width="2" stroke-linejoin="round"/>
        ${labels}
      </svg>`;
    }
    function radarCell(scores, name) {
      if (!scores) return "-";
      const svg = radarSVG(scores);
      return `<div class="radar-cell">
        <div title="点击放大查看">${svg}</div>
        <button class="radar-dl" data-name="${name}" data-scores='${JSON.stringify(scores)}'>保存报告</button>
      </div>`;
    }

    function answersBlock(r) {
      const ans = Array.isArray(r.answers) ? r.answers : [];
      if (!ans.length) return `<span style="color:var(--muted)">-</span>`;
      const name = r.result_name || "报告";
      return `<button class="ans-trigger" data-answers='${JSON.stringify({ ans, name })}' title="点击查看整张试卷">📋 查看试卷</button>`;
    }

    function codeCell(info) {
      if (!info) return "-";
      const code = info.code || "匿名考生";
      return `<b style="white-space:nowrap;">${code}</b>`;
    }
    function locCell(info) {
      if (!info) return "-";
      return info.loc || "-";
    }

    function draw(rows) {
      if (!rows.length) {
        $("#table").innerHTML = '<div class="empty"><b>暂无记录</b>先去答几题，再回来就能看到数据了</div>';
        return;
      }
      const head = `<thead><tr><th style="width:110px">时间</th><th>人格</th><th style="width:70px">匹配度</th><th>考生代号</th><th>当前坐标</th><th>六维</th><th>答题答案</th></tr></thead>`;
      const body = rows.map(r => `
        <tr>
          <td>
            <div>${formatTime(r.created_at)}</div>
            <div class="time">${r.record_id || "-"}</div>
          </td>
          <td>
            <span class="badge">${r.result_name || "-"} <code>${r.result_type || ""}</code></span>
          </td>
          <td><span class="match">${r.match_rate != null ? r.match_rate + "%" : "-"}</span></td>
          <td>${codeCell(r.info)}</td>
          <td>${locCell(r.info)}</td>
          <td>${radarCell(r.scores, r.result_name || "雷达图")}</td>
          <td>${answersBlock(r)}</td>
        </tr>
      `).join("");
      $("#table").innerHTML = `<table>${head}<tbody>${body}</tbody></table>`;
      /* 保存报告 / 答题弹窗 事件委托 */
      $("#table").addEventListener("click", function(e) {
        /* ---- 保存报告 ---- */
        const btn = e.target.closest(".radar-dl");
        if (btn) {
          const row = btn.closest("tr");
          if (!row) return;
          const name = btn.getAttribute("data-name") || "xbti";
          const sc = JSON.parse(btn.getAttribute("data-scores"));
          const matchEl = row.cells[2] ? row.cells[2].textContent.trim() : "-";
          const timeEl = row.cells[0] ? row.cells[0].querySelector(".time") : null;
          const recordId = timeEl ? timeEl.textContent.trim() : "-";
          const codeEl = row.cells[3] ? row.cells[3] : null;
          const codeName = codeEl ? (codeEl.textContent.trim() || "-") : "-";
          saveReportImage(name, sc, matchEl, recordId, codeName);
          return;
        }
        /* ---- 答题详情弹窗 ---- */
        const ansBtn = e.target.closest(".ans-trigger");
        if (ansBtn) {
          const data = ansBtn.getAttribute("data-answers");
          openAnswerModal(data);
        }
      });
    }

    /* ---------- 保存报告图片 ---------- */
    function saveReportImage(name, scores, matchRate, recordId, codeName) {
      const types = D.types || [];
      const type = types.find(t => t.name === name) || types.find(t => t.code === name) || {};
      if (!type.name) { toast("未找到对应人格数据，无法生成完整报告"); return; }

      const rateNum = parseInt(String(matchRate).replace(/[^0-9]/g, ""), 10) || 0;
      const svgStr = buildReportSVG(type, rateNum, scores);
      const xml = new XMLSerializer().serializeToString(parseSVG(svgStr));
      const svgBytes = unescape(encodeURIComponent(xml));
      const src = "data:image/svg+xml;base64," + btoa(svgBytes);

      const img = new Image();
      img.onload = () => {
        const W = img.width || 720;
        const H = img.height || 920;
        const c = document.createElement("canvas");
        c.width = W; c.height = H;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fffdf8";
        ctx.fillRect(0, 0, W, H);
        ctx.drawImage(img, 0, 0);
        c.toBlob(b => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(b);
          a.download = name + "-诊断书.png";
          a.click();
          toast("已保存：" + name + "-诊断书.png");
        }, "image/png");
      };
      img.onerror = () => toast("报告生成失败，请重试");
      img.src = src;
    }

    function parseSVG(str) {
      const p = new DOMParser().parseFromString(str, "image/svg+xml");
      return p.documentElement;
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y + r, r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
    }

    /* ---------- 完整检测报告 SVG（与前台 app.js 保持一致） ---------- */
    function buildPrescription(type) {
      if (D.rxPresets && D.rxPresets[type.name]) return D.rxPresets[type.name];
      return `1. 每日摸鱼不超过 6 小时（留点力气给真正想做的事）。
            2. 发疯前先深呼吸，数到三，然后该疯疯（建议去公园）。
            3. 23:30 前把手机拴在床尾，与「${type.name}」的本能和解。`;
    }

    function buildReportSVG(type, matchRate, scores) {
      const W = 720, PAD = 40;
      const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const wrap = (t, max) => { t = String(t); const out = []; for (let i = 0; i < t.length; i += max) out.push(t.slice(i, i + max)); return out; };
      const label = (txt, y, color) => `<text x="${PAD}" y="${y}" font-size="16" font-weight="700" fill="${color}" font-family="sans-serif">${esc(txt)}</text>`;
      const line = (txt, y, size, color) => `<text x="${PAD}" y="${y}" font-size="${size}" fill="${color}" font-family="sans-serif">${esc(txt)}</text>`;
      let y = 60, body = "";
      body += `<text x="${W / 2}" y="${y}" text-anchor="middle" font-size="23" font-weight="700" fill="#d9480f" font-family="sans-serif">XBTI 国家精神状态鉴定中心</text>`; y += 26;
      body += `<text x="${W / 2}" y="${y}" text-anchor="middle" font-size="12" fill="#6b6354" font-family="sans-serif">经 ISO 23333 抽象质量管理体系认证</text>`; y += 22;
      body += `<line x1="${PAD}" y1="${y}" x2="${W - PAD}" y2="${y}" stroke="#e3ddd0" stroke-width="1"/>`; y += 32;
      body += `<text x="${W / 2}" y="${y}" text-anchor="middle" font-size="14" fill="#6b6354" font-family="sans-serif">你被确诊为</text>`; y += 40;
      body += `<text x="${W / 2}" y="${y}" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2620" font-family="sans-serif">${esc(type.name)}</text>`; y += 30;
      body += `<text x="${W / 2}" y="${y}" text-anchor="middle" font-size="15" fill="#d9480f" font-family="sans-serif">${esc(type.code)} · 匹配度 ${matchRate}%</text>`; y += 24;
      const radarS = 300, radarX = (W - radarS) / 2, radarY = y;
      body += `<svg x="${radarX}" y="${radarY}" width="${radarS}" height="${radarS}" viewBox="0 0 320 320">${radarSVG(scores)}</svg>`;
      y += radarS + 16;
      body += label("学术解读（伪）", y, "#b23b2e"); y += 26;
      wrap(type.academic, 40).forEach(l => { body += line(l, y, 15, "#2b2620"); y += 24; }); y += 10;
      body += label("隐藏槽点", y, "#b23b2e"); y += 26;
      wrap(type.flaw, 40).forEach(l => { body += line(l, y, 15, "#2b2620"); y += 24; }); y += 10;
      body += `<text x="${W / 2}" y="${y}" text-anchor="middle" font-size="18" font-weight="700" fill="#b23b2e" font-family="sans-serif">「 ${esc(type.verdict)} 」</text>`; y += 28;
      body += label("处 方 笺", y, "#b23b2e"); y += 24;
      body += line("诊断：当代青年标准精神损耗（" + esc(type.name) + "型）", y, 14, "#6b6354"); y += 22;
      wrap(buildPrescription(type).replace(/<br>\s*/g, " "), 42).forEach(l => { body += line(l, y, 14, "#2b2620"); y += 22; }); y += 8;
      const disclaimer = (D.meta && D.meta.disclaimer) || "娱乐测试，非心理诊断。结果仅供自嘲，不作就医、入职、相亲依据。";
      wrap(disclaimer, 44).forEach(l => { body += `<text x="${W / 2}" y="${y}" text-anchor="middle" font-size="11" fill="#9a9384" font-family="sans-serif">${esc(l)}</text>`; y += 16; });
      const H = y + 28;
      const bg = `<rect x="0" y="0" width="${W}" height="${H}" fill="#fffdf8"/><rect x="12" y="12" width="${W - 24}" height="${H - 24}" fill="none" stroke="#e3ddd0" stroke-width="1.5" rx="14"/>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bg}${body}</svg>`;
    }

    /* ---------- 答题详情弹窗 ---------- */
    function openAnswerModal(dataJson) {
      let payload;
      try { payload = typeof dataJson === "string" ? JSON.parse(dataJson) : dataJson; } catch { return; }
      const { ans, name } = payload;
      if (!ans || !ans.length) return;

      const qs = (D.questions || []);
      const modal = document.createElement("div");
      modal.className = "ans-modal-overlay";
      modal.innerHTML = `
        <div class="ans-modal">
          <div class="ans-modal-head">
            <span>📋 ${escHtml(name)} — 整张试卷</span>
            <button class="ans-modal-close" type="button">✕</button>
          </div>
          <div class="ans-modal-body">${renderAnswerItems(ans, qs)}</div>
        </div>`;
      document.body.appendChild(modal);
      modal.addEventListener("click", e => {
        if (e.target === modal || e.target.classList.contains("ans-modal-close")) {
          modal.remove();
        }
      });
      /* 折叠/展开 */
      modal.addEventListener("click", e => {
        const hd = e.target.closest(".ans-item-head");
        if (!hd) return;
        const item = hd.parentElement;
        item.classList.toggle("expanded");
      });
    }

    function renderAnswerItems(ans, qs) {
      return ans.map((a, i) => {
        const q = qs[i] || {};
        const qText = escHtml(q.q || ("第 " + (i + 1) + " 题"));
        const opts = Array.isArray(q.options) ? q.options : [];
        let optsHtml = "";
        if (opts.length) {
          optsHtml = `<div class="ans-opts">${opts.map((o, j) => {
            const letter = String.fromCharCode(65 + j);
            const picked = (a === o.t || a === o.k || a === letter || a === (j + 1));
            return `<span class="ans-opt${picked ? " picked" : ""}">${letter}. ${escHtml(o.t)}</span>`;
          }).join("")}</div>`;
        } else {
          optsHtml = `<div class="ans-opts"><span class="ans-opt picked">${escHtml(String(a))}</span></div>`;
        }
        return `<div class="ans-item">
          <div class="ans-item-head"><b>Q${i + 1}</b> ${qText}</div>
          <div class="ans-item-body">${optsHtml}</div>
        </div>`;
      }).join("");
    }

    function escHtml(s) {
      const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
    }

    async function load() {
      const token = $("#token").value.trim();
      if (!token) { toast("请先输入管理员令牌"); return; }
      $("#msg").textContent = "加载中…";
      try {
        const res = await fetch(API + "?token=" + encodeURIComponent(token));
        if (res.status === 403) { $("#msg").textContent = "令牌错误或无权限"; return; }
        const data = await res.json();
        const records = Array.isArray(data) ? data : (data.results || []);
        render(records);
        $("#msg").textContent = `共 ${records.length} 条记录`;
      } catch (e) {
        $("#msg").textContent = "请求失败：" + e.message;
      }
    }

    function exportCSV() {
      const rows = window.__records || [];
      if (!rows.length) { toast("没有可导出的数据"); return; }
      const header = ["record_id", "created_at", "result_type", "result_name", "match_rate", "code_name", "location", "scores", "answers"];
      const lines = [header.join(",")];
      rows.forEach(r => {
        const sc = r.scores ? JSON.stringify(r.scores).replace(/"/g, '""') : "";
        const an = Array.isArray(r.answers) ? r.answers.join("") : "";
        const codeName = r.info ? (r.info.code || "") : "";
        const location = r.info ? (r.info.loc || "") : "";
        lines.push([r.record_id, r.created_at, r.result_type, r.result_name, r.match_rate, '"' + codeName + '"', '"' + location + '"', '"' + sc + '"', '"' + an + '"'].join(","));
      });
      const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "xbti-records.csv"; a.click();
      toast("CSV 已导出");
    }

    $("#load").onclick = load;
    $("#export").onclick = exportCSV;
  </script>
</body>
</html>
