name = "xbti"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# D1 数据库绑定（Cloudflare Pages Functions 使用）
[[d1_databases]]
binding = "XBTI_DB"
database_name = "xbti"
database_id = "YOUR_D1_DATABASE_ID"   # 用 `wrangler d1 create xbti` 生成后填入

# 管理员令牌请务必用 secret 注入，不要写在这里：
#   wrangler pages secret put XBTI_ADMIN_TOKEN
# 或在 Cloudflare 面板 → Pages → 设置 → 环境变量 中添加 XBTI_ADMIN_TOKEN
